# ============================================================
# MovieRoll Stage 3 -- rolling DMD distillation, ACS (anchor-conditioned scoring)
# ============================================================
# The image-to-video recipe. It is `stage3_dmd_rolling.yaml` with four functional keys and the phase-2 length
# changed (see Phases below), and it distils a dedicated i2v weight; the released text-to-video weight comes
# from that file instead.
#
#   * dmd.score_mode: acs -- the window whose scoring crop starts at the i2v anchor is scored the way this
#     model was trained for i2v: the anchor latent in the condition channels, a mask on frame 0, and the
#     anchor's SigLIP tokens. The CFG unconditional branch drops only the text and keeps the image, and the
#     critic sees the same condition as the teacher. Every later window is scored as t2v, exactly as in the
#     released recipe, so the teacher is never conditioned on generated frames.
#   * siglip_path -- the SigLIP tower the score models read the anchor with.
#   * video.task_sampling.t2v_prob: 0 -- ACS is image-to-video only (the validator enforces it): a t2v
#     batch has no anchor, so there would be nothing to condition the first window on.
#   * dmd.sampling_context_noise: 0 -- training-time samples are inference, and these weights are sampled
#     without context noise. Training keeps the released context_noise 0.15.
#
# Everything else is the released recipe, including the anchor itself: the rollout still generates its own
# first frame (self-anchored) and the clean history is still noised with context_noise 0.15.
#
# Topology: ACS needs ONE FSDP shard group, so `fsdp.shard_world_size` must equal the world size (the
# reference run used 32 = 4 nodes x 8). The critic's vision_in only gets a gradient on the anchor window,
# and which window that is follows each shard group's own start-phase draw, so several replicas would
# disagree about what to all-reduce. `trainer/dmd/setup.py` refuses the combination before loading weights.
#
# Phases: phase 1 for 600 steps, then phase 2 for 900, i.e. the released i2v weight is the EMA at global
# step 1500.
#
# Inference: sample these weights without context noise and with an `--input-image` / `input_image` column:
# a model folder built with `movieroll/configs/models/distilled/i2v/config.json` sets context_noise 0, while the
# bare distilled profile (`--dit-weight`) defaults to 0.15 and needs `--context-noise 0`.
#
# Paths are placeholders, as in the released config. The sampling CSV additionally needs an `input_image`
# column: ACS samples are image-to-video.

exp_name: "movieroll_stage3_dmd_acs"
logdir: "./outputs/movieroll_stage3_dmd_acs"
resume_checkpoint: null

dfake_gen_update_ratio: 3
gradient_accumulation_steps: 1
save_interval: 100
sample_interval: 100
val_interval: 300
gc_interval: 3000

optimizer:
  lr: 1.0e-5
  lr_critic: 1.0e-5
  # Default aligned with Stage 2 / SFT; tunable as any finite non-negative value.
  weight_decay: 0.01
  adamw_betas: [0.9, 0.999]
  adamw_betas_critic: [0.9, 0.999]
  adamw_eps: 1.0e-8

max_grad_norm_generator: 10.0
max_grad_norm_critic: 10.0

# Sequence parallelism is four-way. `shard_world_size` is the size of ONE FSDP shard group, and ACS requires
# that to be the whole world (see the header): raise it to your world size, 8 here for one 8-GPU node.
sp_size: 4
fsdp:
  sharding_strategy: "hybrid"
  shard_world_size: 8
  generator_checkpointing: true
  real_score_checkpointing: false
  fake_score_checkpointing: true
  generator_cpu_offload: false
  real_score_cpu_offload: false
  fake_score_cpu_offload: false
  text_encoder_cpu_offload: false

streaming_config:
  streaming_max_num_latent_frames: 120
  streaming_chunk_size: 4
  streaming_window_size: 5
  streaming_full_history_block_num: 6
  streaming_kv_recompute_enabled: true
  streaming_kv_recompute_threshold: 18
  streaming_kv_recompute_recent_k: 3

dmd:
  min_step_ratio: 0.02
  max_step_ratio: 0.98
  timestep_shift: 5.0
  real_guidance_scale: 4.0
  # Normalized sigma ratio applied only to the clean KV context; 0 disables it. The released value: the
  # self-generated anchor is noised with the rest of the history, exactly as in the t2v recipe.
  context_noise: 0.15
  # Samples are inference, and these weights are sampled at 0.
  sampling_context_noise: 0.0
  # "t2v" = the released recipe, the score models never see the condition; "acs" = the anchor window is
  # scored as i2v.
  score_mode: "acs"

  denoising_step_list: [1000, 800, 600, 400, 200]
  score_window_latent_frames: 31
  uniform_timestep_regularization:
    # probability: 0.0 disables the regularizer.
    probability: 0.5
    candidate_step_indices: [1, 2, 3, 4]
  # Final-video sampling is T-cache streaming and uses this chunk cap; null decodes in one pass.
  vae_stream_decode_max_chunk_size: 4

  # KV recompute keeps the sink plus the recent chunks and samples this many middle chunks.
  recompute_mid_chunk_min: 1
  recompute_mid_chunk_max: 5

dmd_phases:
  short_single_event:
    max_steps: 600
    video_length: 241
    latent_frames: 61
    event_count: 1
    # Single-event CSV: the prompt_column column is read (other columns are ignored).
    csv: "./data/movieroll/stage3_phase1_prompts.csv"
    prompt_column: "prompt"

  # Either phase takes one or two events. One: event_count 1 and prompt_column. Two: event_count 2,
  # event_columns [event_1, event_2] and the switch_frame_min / switch_frame_max range.
  long_dual_event:
    max_steps: 900
    video_length: 721
    latent_frames: 181
    event_count: 2
    # The CSV must expose exactly event_1 and event_2 (plus any non-event columns).
    csv: "./data/movieroll/stage3_phase2_event_captions.csv"
    event_columns: ["event_1", "event_2"]
    switch_frame_min: 129
    switch_frame_max: 593

# Trainable models keep fp32 sharded master parameters. FSDP all-gather and the forward pass use
# bf16; gradient reduction uses fp32.
master_weight_type: "fp32"
mixed_precision: true
allow_incomplete_checkpoint: false
sample_at_start: false

generator_ckpt: "./outputs/movieroll_stage2_ode/stage2_ode_1000steps_<timestamp>/checkpoints/step-1000/student.safetensors"
# ACS requires one initialization for both score models: the teacher and the critic must not differ at step 0.
real_score_ckpt: "ckpts/transformer/480p_t2v/diffusion_pytorch_model.safetensors"
fake_score_ckpt: "ckpts/transformer/480p_t2v/diffusion_pytorch_model.safetensors"
# The score models read the anchor frame through this tower; it holds image_encoder/ and feature_extractor/.
siglip_path: "ckpts/siglip"

model_type: "MovieRoll-16164-MMDiT"
# Full attention of the non-streaming real / fake score models: flash3 or torch (the same math; torch is SDPA).
attn_mode: "flash3"

# VAE / text encoder
vae_path: "ckpts/vae"
vae_precision: "fp16"
text_encoder_path: "ckpts/text_encoder/llm"
text_encoder_precision: "fp16"
text_len: 1000
byt5_google_path: "ckpts/text_encoder/byt5-small"
byt5_ckpt_path: "ckpts/text_encoder/Glyph-SDXL-v2/checkpoints/byt5_model.pt"
multilingual_prompt_format_font_path: "ckpts/text_encoder/Glyph-SDXL-v2/assets/multilingual_10-lang_idx.json"
multilingual_prompt_format_color_path: "ckpts/text_encoder/Glyph-SDXL-v2/assets/color_idx.json"
byt5_max_length: 256

video:
  # One resolution (H, W) for both phases.
  resolution: [480, 864]
  task_sampling:
    # ACS is image-to-video only.
    t2v_prob: 0.0

ema_weight: 0.99
ema_start_step: 200

data:
  batch_size: 1
  num_workers: 2

disable_tensorboard: true

sampling:
  # The training-time sampling benchmark: ordered event columns event_1..event_N, no empty cell, plus an
  # input_image column (relative to this CSV) because ACS samples are image-to-video.
  test_event_csv: "./data/movieroll/stage3_test_events_i2v.csv"
  num_samples: 8
  val_num_samples: 32
  video_length: 721
  height: 480
  width: 864
  seed: 42
  decode_to_video: true
  save_latents: false
