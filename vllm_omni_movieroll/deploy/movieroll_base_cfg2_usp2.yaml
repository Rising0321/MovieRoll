# MovieRoll deploy: Base chain with classifier-free guidance on (a directory with use_cfg: false has no second branch and
# refuses cfg_parallel_size 2): CFG parallel 2 x Ulysses 2 over 4 GPUs.
# Use with: vllm serve <model dir> --omni --deploy-config vllm_omni_movieroll/deploy/movieroll_base_cfg2_usp2.yaml
# MovieRoll's sampling settings (the validated list profiles.OVERRIDABLE) are changed in the stage entry below, next to
# devices: `model_config: {movieroll_overrides: {kv_recompute_threshold: 12}}`.
async_chunk: false
distributed_executor_backend: mp
dtype: bfloat16

stages:
  - stage_id: 0
    devices: "0,1,2,3"
    max_num_seqs: 1
    # MovieRoll's streaming VAE decode is exact and chunk-bounded; tiling would blend tiles
    vae_use_tiling: false
    parallel_config:
      cfg_parallel_size: 2
      ulysses_degree: 2
