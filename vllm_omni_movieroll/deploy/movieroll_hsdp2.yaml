# MovieRoll deploy: HSDP: the DiT blocks sharded over 2 GPUs (FSDP2), all-gathered per block.
# Use with: vllm serve <model dir> --omni --deploy-config vllm_omni_movieroll/deploy/movieroll_hsdp2.yaml
# MovieRoll's sampling settings (the validated list profiles.OVERRIDABLE) are changed in the stage entry below, next to
# devices: `model_config: {movieroll_overrides: {kv_recompute_threshold: 12}}`.
async_chunk: false
distributed_executor_backend: mp
dtype: bfloat16

stages:
  - stage_id: 0
    devices: "0,1"
    max_num_seqs: 1
    # MovieRoll's streaming VAE decode is exact and chunk-bounded; tiling would blend tiles
    vae_use_tiling: false
    parallel_config:
      use_hsdp: true
      hsdp_shard_size: 2
